# Dalton Dark — colorblind-friendly (deuteranopia/protanopia) terminal palette
# for Ghostty. Matches the canonical palette in `palettes.json`.
#
# Install:
#   mkdir -p ~/.config/ghostty/themes
#   cp dalton-dark.conf ~/.config/ghostty/themes/dalton-dark
#   # then in ~/.config/ghostty/config:
#   theme = dalton-dark
#
# Or, on macOS, drop the file into:
#   ~/Library/Application Support/com.mitchellh.ghostty/themes/dalton-dark
#
# Reference: https://ghostty.org/docs/config/reference#theme

background = 1b1b1b
foreground = c8c9cc

cursor-color = 9a9a9a
cursor-text = 1b1b1b

selection-background = 333333
selection-foreground = dcdcdc

# ANSI 0..7  (normal)
palette = 0=#282828
palette = 1=#d85050
palette = 2=#5b914e
palette = 3=#c4c40c
palette = 4=#7aa2f7
palette = 5=#a050d0
palette = 6=#56717f
palette = 7=#b8b8b8

# ANSI 8..15 (bright)
palette = 8=#3c3c3c
palette = 9=#f07068
palette = 10=#88b97d
palette = 11=#eded02
palette = 12=#97b1f1
palette = 13=#c070f0
palette = 14=#6691a7
palette = 15=#d8d8d8
